[pytest]
testpaths = tests
addopts = -q -p no:cacheprovider
norecursedirs =
    .git
    .pytest_cache
    .pytest_tmp
    __pycache__
    pytest-cache-files-*
    tests/runtime_data
    tests/runtime_api_data
    tests/runtime_graph_data
    tests/runtime_sarvam_data
    tests/runtime_experience_data
    tests/runtime_audio
